site_name: SynthAudit-Bench
site_description: Reference-free structural trustworthiness benchmark for synthetic tabular datasets
repo_url: https://github.com/rvndye/synthaudit-bench
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Ontology (STO): ontology.md
  - Domain model: domain-model.md
  - Schema system: schema-system.md
  - Canonicalization: canonicalization.md
  - Configuration: configuration.md
  - Registry and corpus: registry.md
  - Acquisition and loading: acquisition-loading.md
  - Detector protocol: detector-protocol.md
  - Identity and versioning: identity.md
  - Future work: future-work.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
