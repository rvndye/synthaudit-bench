name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Ruff version
        run: |
          uv run ruff --version
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy, strict)
        run: uv run mypy
      - name: Import contracts (import-linter)
        run: uv run lint-imports
      - name: Tests and coverage
        run: uv run pytest

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate normative JSON artifacts are well-formed
        run: |
          python - <<'PY'
          import glob
          import json

          files = glob.glob("schemas/**/*.json", recursive=True)
          files += glob.glob("sto/**/*.json", recursive=True)
          files += glob.glob("conformance/**/*.json", recursive=True)
          for f in files:
              with open(f) as fh:
                  json.load(fh)
          print(f"validated {len(files)} JSON artifact(s)")
          PY
