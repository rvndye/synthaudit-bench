name: Reproduce

# Runs the reproducibility and determinism test tier. Scheduled and manual so it
# never gates ordinary commits; the tier grows as the pipeline is implemented.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reproducibility and determinism tests
        run: python -m pytest tests/reproducibility -q
